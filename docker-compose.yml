version: '3'
services:
  postgres:
    image: postgres
    container_name: postgres
    restart: unless-stopped
    tty: true
    networks:
      - lanchonete-network
    environment:
      POSTGRES_DB: lanchonete
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    #ports:
    #  - "5435:5432"
    #volumes:
    #  - ./db/data :/postgresql/data

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    restart: unless-stopped
    tty: true
    ports:
      - "5672:5672"   # Porta padrão do RabbitMQ
      - "15672:15672" # Porta da interface de gerenciamento
    networks:
      - lanchonete-network
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest

  lanchonete:
    build: .
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - rabbitmq
    networks:
      - lanchonete-network

networks:
  lanchonete-network:
    driver: bridge
